<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landquiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- KART ØVERST -->
  <section class="card mapCard">
    <div class="mapTop">
      <h2 class="mapTitle">Verdenskart</h2>
      <div class="mapCounts" id="mapCounts">0 / 198</div>
    </div>
    <div class="muted">Trykk på kartet for å zoome.</div>

    <button id="openMap" class="mapFrame" type="button" aria-label="Åpne kart i fullskjerm">
      <div class="mapContainer">
        <object id="worldMapObj" type="image/svg+xml" data="BlankMap-World.svg" aria-label="Verdenskart"></object>
      </div>
    </button>
  </section>

  <!-- FULLSKJERM KART -->
  <div id="mapModal" class="modal" hidden aria-hidden="true">
    <div class="modalHeader">
      <div class="modalTitle">
        Verdenskart <span class="muted" id="modalCounts"></span>
      </div>
      <button id="closeMap" class="secondary" type="button">Lukk</button>
    </div>

    <div class="modalBody">
      <div id="panzoomViewport" class="panzoomViewport">
        <object id="worldMapObjModal" type="image/svg+xml" data="BlankMap-World.svg" aria-label="Verdenskart fullskjerm"></object>
      </div>
      <div class="panzoomHelp muted">Tips: Dra med én finger. Zoom med to fingre.</div>
    </div>
  </div>

  <!-- APP -->
  <header class="card">
    <h1>Landquiz</h1>
    <p>Skriv inn land under riktig kontinent. Trykk Enter for å legge til.</p>

    <div class="actions">
      <button id="resetAll" type="button">Nullstill alt</button>
      <button id="finishBtn" class="secondary" type="button">Avslutt</button>
      <span id="totalCounts" class="totalCounts"></span>
    </div>

    <div id="globalFeedback" class="feedback" aria-live="polite"></div>
  </header>

  <!-- RESULTAT -->
  <section id="results" class="card results" hidden>
    <div class="resultsTop">
      <h2>Manglende land</h2>
      <div id="missingTotals" class="muted"></div>
    </div>
    <div id="missingByContinent"></div>

    <div class="resultsActions">
      <button id="closeResults" class="secondary" type="button">Skjul</button>
    </div>
  </section>

  <main id="continents"></main>

  <template id="continentTpl">
    <section class="card continent">
      <div class="top">
        <h2 class="name"></h2>
        <div class="counts"></div>
      </div>

      <input class="input" type="text" inputmode="text" autocomplete="off"
             placeholder="Skriv et land og trykk Enter…" />

      <div class="feedback" aria-live="polite"></div>
      <div class="list"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
